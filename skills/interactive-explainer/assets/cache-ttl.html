<script>
(() => {
  const history = document.querySelector('.ttl-history');
  const plot = history.querySelector('.history-plot');
  const buttons = [];
  let onSelect;

  function heightAt(event, lane) {
    return (lane === 'base' ? 89 : 146) - (event.price - 10) * 7;
  }

  function addEvent(index) {
    const button = document.createElement('button');
    button.className = 'history-event';
    button.type = 'button';
    button.innerHTML = '<span class="history-point base" aria-hidden="true"><i></i><b></b></span><span class="history-point current" aria-hidden="true"><i></i><b></b></span><span class="history-tick" aria-hidden="true"></span>';
    button.addEventListener('click', () => onSelect(index));
    button.addEventListener('keydown', event => {
      if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
      event.preventDefault();
      const next = Math.max(0,Math.min(buttons.length - 1,index + (event.key === 'ArrowRight' ? 1 : -1)));
      buttons[next].focus();
      onSelect(next);
    });
    plot.append(button);
    buttons.push(button);
  }

  window.paintHistory = function (baseline, current, index, ttl, selectIndex) {
    onSelect = selectIndex;
    const span = current[current.length - 1].time;
    const x = time => 100 * time / span;
    while (buttons.length < current.length) addEvent(buttons.length);
    history.querySelector('.history-label.current small').textContent = 'TTL ' + ttl + ' 秒';
    history.querySelector('.history-highlight').style.left = x(current[index].time) + '%';
    for (const [lane, events] of [['base', baseline], ['current', current]]) {
      const points = events.map((event, i) => i === 0
        ? 'M' + x(event.time) + ',' + heightAt(event, lane)
        : 'H' + x(event.time) + 'V' + heightAt(event, lane));
      history.querySelector('path.' + lane).setAttribute('d', points.join(' '));
      events.forEach((event, i) => {
        const point = buttons[i].querySelector('.history-point.' + lane);
        point.style.top = (heightAt(event, lane) - 38) + 'px';
        point.querySelector('i').className = event.hit ? 'history-dot' : 'history-diamond';
        point.querySelector('b').textContent = '¥' + event.price;
      });
    }
    const result = event => (event.hit ? '命中' : '回源') + event.price + '元';
    current.forEach((event, i) => {
      const button = buttons[i];
      button.style.left = x(event.time) + '%';
      button.setAttribute('aria-label','第' + event.time + '秒，基线' + result(baseline[i]) + '，当前' + result(event));
      button.setAttribute('aria-pressed', String(i === index));
      button.querySelector('.history-tick').textContent = event.time + ' 秒';
    });
  };
})();
</script>

<script>

    if (!hit) entry = {price:source,written:time,expires:time+ttl};

  const w=m?256+117*p:238+225*p, h=132+76*p;
  const right=x+w, bottom=y+h, portY=y+64+12*p, topPortX=x+w*.48;
  const sx=m?96-2*p:695+54*p, sy=m?334+32*p:265+27*p;

  put('reqHeading',m?8:20,m?20:29);

  for(const [id,shift] of [['back2',7],['back1',3.5],['face',0]]) attrs(el(id),{x:shift,y:shift,width:w,height:h});

  const ax=117+5*p, ay=77+2*p, aw=w-ax-17;
  at('ruler',ax,ay);
  const lo=old?old.written:ev.time, expiry=old?old.expires:lo, hi=Math.max(expiry,ev.time,lo+1);
  const domain=Math.max(16,hi,ev.entry.expires)+1;
  const xp=t=>aw*t/domain;
  attrs(el('ruler'),{opacity:old?1:clamp((p-.45)/.55)});
  attrs(el('axisBase'),{x:0,y:0,width:aw});attrs(el('validZone'),{x:xp(lo),y:0,width:Math.max(0,xp(expiry)-xp(lo))});
  attrs(el('newZone'),{x:xp(ev.time),y:0,width:ev.hit?0:Math.max(0,xp(ev.entry.expires)-xp(ev.time))});
  const ex=xp(expiry), now=xp(ev.time);
  el('expiresMark').setAttribute('d','M'+ex+' -3v20');
  at('nowMark',now,0);put('axisLeft',2,27);put('axisRight',ex,27);put('newEnd',xp(ev.entry.expires),27);
  put('nowLabel',Math.max(25,Math.min(aw-25,now)),-16);
  const detail=clamp((p-.55)/.45);
  const cashY=t=>t<6?72:53;
  const startY=cashY(0);
  const crosses=domain>=6;
  const stepX=xp(6);
  const series='M0 '+startY+(crosses?' H'+stepX+' V53':'')+' H'+aw;
  el('sourceSeries').setAttribute('d',series);
  el('compareGuide').setAttribute('d','M'+now+' 15V'+cashY(ev.time));
  attrs(el('sourceDot'),{cx:now,cy:cashY(ev.time)});
  put('tracePrice',now>aw-38?now-8:now+7,cashY(ev.time)+13);
  el('tracePrice').setAttribute('text-anchor',now>aw-38?'end':'start');
  write('tracePrice','¥'+ev.source);
  put('changeTime',stepX-4,45);el('changeTime').setAttribute('text-anchor','end');
  write('changeTime',crosses?'6 s 涨价':'');
  put('sourceLegend',17,ay+65);attrs(el('sourceLegend'),{opacity:detail});
  ticks.forEach((mark,i)=>{const t=i+1;attrs(mark,{x1:xp(t),x2:xp(t),visibility:t<domain?'visible':'hidden'});});
  attrs(el('equation'),{'aria-hidden':!expanded});
  attrs(el('axisExtra'),{'aria-hidden':!expanded});
  attrs(el('axisExtra'),{opacity:detail});attrs(el('equation'),{opacity:clamp((p-.83)/.17)});
  put('equation',17,h-19);put('recordState',17,112+2*p);
  write('axisLeft',(!ev.hit && ev.entry.expires<5)?'':'0 s');
  write('axisRight',old && ex>55 && (ev.hit || xp(ev.entry.expires)-ex>75)?'到期 '+expiry+' s':'');
  write('newEnd',ev.hit?'':('写回至 '+ev.entry.expires+' s'));
  attrs(el('newEnd'),{'text-anchor':xp(ev.entry.expires)<90?'start':'end'});
  write('nowLabel','读取 '+ev.time+' s');
  write('equation',old?ev.time+' s '+(ev.hit?'<':'≥')+' '+expiry+' s  ·  '+(ev.hit?'有效，沿用缓存':'到期，写回 ¥'+ev.price):'空缓存  →  首次回源');
  write('recordState',old?'读前 · 写入于 '+old.written+' s':'读取前没有记录');
  write('cachedPrice',old?'¥'+old.price:'∅');
  requests.forEach(({row,shape,time,dot,path},i)=>{
    const active=i===index,rw=m?72:89, rh=m?34:36;
    const rx=m?10+i*99:20,ry=m?46:57+i*51;
    row.setAttribute('transform','translate('+rx+' '+ry+')');
    attrs(row,{'aria-pressed':active});
    attrs(shape,{width:rw,height:rh,fill:active?'#eeeaff':'#fff',stroke:active?'#9a8bec':'#dcdde6'});
    attrs(time,{x:rw/2+3,y:rh/2+1,style:'fill:'+(active?'#5545b6':'#687084')});
    attrs(dot,{cx:10,cy:rh/2,fill:active?'#7161d4':'#cfd0dc'});
    const d=m?curve(rx+rw/2,ry+rh,topPortX,y,true):curve(rx+rw,ry+rh/2,x,portY);
    wire(path,d,active?'url(#readFlow)':'#e5e5ee',active?6:2.1);
  });
  const outD=m?curve(right-43,bottom,ox+23,replyY,true):curve(right,portY,ox-12,replyY);
  wire(el('outWire'),outD,ev.hit?'url(#responseFlow)':'#d59260',6);
  // A miss leaves the cache, reads the origin, then writes the fresh record back.
  const goD=m?curve(x+w*.20,bottom,sx-46,sy-7,true):curve(x+w*.48,bottom,sx-65,sy+20,true);
  const backD=m?curve(sx+43,sy-7,x+w*.52,bottom,true):'M'+(sx+65)+' '+(sy+20)+' C'+(sx+123)+' '+(sy+18)+' '+(sx+91)+' '+(bottom+32)+' '+(sx+32)+' '+(bottom+32)+' S'+(right-20)+' '+(bottom+26)+' '+(right-20)+' '+bottom;
  for(const [id,d] of [['dbGo',goD],['dbBack',backD]]) wire(el(id),d,ev.hit?'#bcbfcb':'#cc8959',ev.hit?1.7:3.6,ev.hit?'4 5':'');
  directionMarks.forEach((mark,i)=>{
    const path=el(i?'dbBack':'dbGo'), len=path.getTotalLength();
    const a=path.getPointAtLength(len*.39), b=path.getPointAtLength(len*.39+1);
    attrs(mark,{transform:'translate('+a.x+' '+a.y+') rotate('+Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI+')',stroke:ev.hit?'#9ea2ae':'#ad6738'});
  });
  put('goLabel',m?sx-47:(x+w*.48+sx-65)/2,m?sy-34:bottom+36);
  put('backLabel',m?sx+71:sx+68,m?sy-29:bottom+24);
  attrs(flowLabel,{x:m?ox+6:(right+ox)/2,y:m?replyY-41:portY-16});
  flowLabel.textContent=ev.hit?'缓存命中':'回源后返回';
  if(m)flowLabel.setAttribute('opacity',0);else flowLabel.setAttribute('opacity',1);
  el('sourceNode').setAttribute('opacity',ev.hit?'.72':'1');
  write('sourceText','源站  ¥'+ev.source);write('returnPrice','¥'+ev.price);
  write('returnSource',ev.hit?'来自缓存':'本次回源');
}
function stopReplay(){
  cancelAnimationFrame(replay);replayStep=-1;el('sourceNode').classList.remove('source-focus');el('cacheNode').classList.remove('cache-focus');el('packet').setAttribute('visibility','hidden');
}
function playRead() {
  stopReplay();if(still.matches)return;
  const ev=events[index];
  const sequence=[requests[index].path,'cache'];
  if(!ev.hit)sequence.push(el('dbGo'),'source',el('dbBack'),'cache');
  sequence.push(el('outWire'));
  const start=performance.now(),packet=el('packet');
  function frame(t){
    let passed=t-start,leg=0;
    const duration=item=>typeof item==='string'?310:490;
    while(leg<sequence.length && passed>=duration(sequence[leg])){passed-=duration(sequence[leg]);leg++;}
    if(leg>=sequence.length){stopReplay();return;}
    const item=sequence[leg],pause=typeof item==='string';
    if(leg!==replayStep){
      replayStep=leg;
      el('cacheNode').classList.toggle('cache-focus',item==='cache');
      el('sourceNode').classList.toggle('source-focus',item==='source');
      packet.setAttribute('visibility',pause?'hidden':'visible');
      packet.lastElementChild.setAttribute('fill',(item===el('dbGo')||item===el('dbBack'))?'#b45b26':'#6556c7');
    }
    if(!pause){const pos=item.getPointAtLength(item.getTotalLength()*clamp(passed/duration(item)));at('packet',pos.x,pos.y);}
    replay=requestAnimationFrame(frame);
  }
  replay=requestAnimationFrame(frame);
}
function render(){
  const ev=events[index],previous=ev.previous;el('hint').hidden=ttl!==10||index!==2;
  el('ttl').value=ttl;el('ttl').setAttribute('aria-valuetext',ttl+' 秒');
  write('ttlNumber',ttl+' s');write('captionTime','t = '+ev.time+' s');
  let why=ev.hit?'缓存要到第 '+previous.expires+' 秒才过期，本次沿用第 '+previous.written+' 秒写入的 '+ev.price+' 元。':previous?'缓存于第 '+previous.expires+' 秒到期，本次从源站取回 '+ev.price+' 元，写回后到期时刻为第 '+ev.entry.expires+' 秒。':'第一次读取时缓存为空，从源站取回 '+ev.price+' 元并写入缓存。';
  write('captionText',why);
  draw();window.paintHistory(base,events,index,ttl,selectIndex);
}
function selectIndex(i){index=i;render();playRead();}
function setTTL(value,play=true){stopReplay();ttl=value;events=simulate(ttl);render();if(play)playRead();}
function setExpanded(value){
  cancelAnimationFrame(morph);expanded=value;
  const to=value?1:0,from=openness,start=performance.now();
  el('cacheNode').setAttribute('aria-expanded',value);
  el('cacheNode').setAttribute('aria-label',value?'收回缓存记录':'展开缓存记录');
  write('toggleText',value?'收回':'展开');
  el('plus').setAttribute('d',value?'M-4 0h8':'M-4 0h8M0-4v8');
  if(still.matches||from===to){openness=to;draw();return;}
  const duration=690*Math.max(.23,Math.abs(to-from));
  function frame(t){
    const u=clamp((t-start)/duration), eased=u*u*(3-2*u);
    openness=from+(to-from)*eased;draw();
    if(u<1)morph=requestAnimationFrame(frame);
  }
  morph=requestAnimationFrame(frame);
}
el('cacheNode').addEventListener('click',()=>setExpanded(!expanded));
el('cacheNode').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setExpanded(!expanded);}});
el('ttl').addEventListener('input',e=>setTTL(Number(e.target.value),false));
el('ttl').addEventListener('change',playRead);
el('variant').addEventListener('click',()=>{index=2;setTTL(8);});
el('reset').addEventListener('click',()=>{index=2;setExpanded(false);setTTL(10,false);});
el('replay').addEventListener('click',playRead);
compact.addEventListener('change',draw);
still.addEventListener('change',()=>{if(still.matches){stopReplay();setExpanded(expanded);}});
render();
</script></body></html>
